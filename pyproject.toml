[project]
name = "dent"
version = "0.1.0"
description = "Data Especially Needs Tidying: 학습 데이터 관리 도구"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "embedded-postgres==18.6.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pgvector>=0.5.0",
    "prompt-toolkit>=3.0",
    "psutil>=5.9",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "python-calamine>=0.8.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "sqlalchemy[asyncio]>=2.0.54",
    "umap-learn>=0.5.12",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
# 켜는 명령: uv run dent
dent = "dent.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# __init__.py 없이 폴더만으로 패키지를 쓴다(암묵적 네임스페이스 패키지). 그래서 묶을 폴더를 직접 적는다.
[tool.hatch.build.targets.wheel]
packages = ["src/dent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]  # import 정렬, 최신 문법, 흔한 버그

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# __init__.py가 없어도 같은 이름의 테스트 파일(tests/api/test_jobs.py, tests/system/test_jobs.py)이
# 부딪치지 않게 importlib로 불러온다. 루트를 경로에 넣어 tests.… 도우미를 import할 수 있게 한다.
addopts = "--import-mode=importlib"
pythonpath = ["."]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
