<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DENT</title>
<style>
:root {
  --bg: #F2F4F1; --surface: #FFFFFF; --ink: #161C19; --ink-2: #39433E; --muted: #67736C; --line: #DFE4DF;
  --good: #1B7A4B; --good-soft: #DFF1E6; --bad: #BF3526; --bad-soft: #FBE3DE; --warn: #9A5B00; --warn-soft: #FAEED6;
  --accent: #2F4FD0;
  --font: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1311; --surface: #161B18; --ink: #E3E9E5; --ink-2: #C2CBC5; --muted: #8B978F; --line: #29302C;
    --good: #5CC48D; --good-soft: #153222; --bad: #F07B6C; --bad-soft: #3B1C17; --warn: #E3A84C; --warn-soft: #35270F;
    --accent: #8CA2FF;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font); }
main { max-width: 640px; margin: 0 auto; padding: 56px 20px; display: flex; flex-direction: column; gap: 20px; }
h1 { margin: 0; font-size: 26px; letter-spacing: -.01em; }
p { margin: 0; color: var(--ink-2); }
ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
li:last-child { border-bottom: 0; }
li b { font-size: 14px; }
li span { font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
li.ok b::before, li.no b::before, li.note b::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
li.ok b::before { background: var(--good); }
li.no b::before { background: var(--bad); }
li.note b::before { background: var(--warn); }
small { color: var(--muted); }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: var(--line); padding: 1px 5px; border-radius: 4px; }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>DENT가 켜졌습니다</h1>
  <p>화면은 아직 만들지 않았습니다. 지금은 켜졌는지와 연결 상태만 보여 줍니다.</p>
  <p>화면을 보려면 <code>pnpm --dir web install &amp;&amp; pnpm --dir web build</code>를 한 번 실행한 뒤 DENT를 다시 켜세요.</p>
  <ul id="status"><li><b>상태</b><span>불러오는 중…</span></li></ul>
  <small>API 문서: <a href="/api/docs">/api/docs</a> · 상태 원본: <a href="/readyz">/readyz</a></small>
</main>
<script>
  const NAMES = { storage: '파일 폴더', db: 'DB', schema: '테이블', worker: '작업 실행기', embedding: '임베딩 서버' };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  async function load() {
    const list = document.getElementById('status');
    try {
      const body = await (await fetch('/readyz')).json();
      const rows = [
        ...Object.entries(body.checks).map(([k, v]) => [k, v, v.ok ? 'ok' : 'no']),
        ...Object.entries(body.info).map(([k, v]) => [k, v, v.ok ? 'ok' : 'note']),
      ];
      list.innerHTML = rows.map(([k, v, cls]) => `<li class="${cls}"><b>${esc(NAMES[k] || k)}</b><span>${esc(v.detail)}</span></li>`).join('');
    } catch (error) {
      list.innerHTML = '<li class="no"><b>상태</b><span>API 서버에 붙지 못했습니다. 런처 창의 안내를 확인하세요.</span></li>';
    }
  }
  load();
  setInterval(load, 5000);
</script>
</body>
</html>
