# 내장 모델 확인(손으로 돌림): Windows · macOS · Linux에서 모델 패키지를 그 OS에 맞는 판으로 설치하고,
# 내장 임베딩(bge-m3)을 CPU에 올려 임베딩 하나를 받아 본다. 모델 파일(약 2.1GB)은 처음 한 번 받고 캐시에 둔다.
name: 내장 모델 확인

on:
  workflow_dispatch:

jobs:
  model:
    name: 내장 임베딩 CPU (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: 설치
        run: uv sync --locked
      - name: 모델 파일 캐시
        uses: actions/cache@v4
        with:
          path: storage/models
          key: models-bge-m3-5617a9f-${{ runner.os }}
      - name: 모델 패키지 설치 → CPU에 올리기 → 임베딩 받기 → 종료
        run: uv run python scripts/launch_check.py --model
